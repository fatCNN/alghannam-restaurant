
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#741f1f">

  <title>إدارة الطلبات | مطعم الغنّام</title>

  <link rel="stylesheet" href="./orders.css">
  <link rel="stylesheet" href="./loader.css">

  <link rel="icon" type="image/webp" href="../image/logo.webp">
  <link rel="apple-touch-icon" href="../image/logo.webp">
</head>

<body>

  <div id="pageLoader" class="page-loader">
    <div class="loader-content">
      <img src="../image/logo.webp" alt="مطعم الغنّام">
      <div class="loader-spinner"></div>
      <p>مطعم الغنّام</p>
      <span>يرجى الانتظار...</span>
    </div>
  </div>

  <header class="topbar">
    <div>
      <strong>مطعم الغنّام</strong>
      <span>إدارة الطلبات</span>
    </div>

    <div class="top-actions">
      <span id="userRole">جارٍ التحقق...</span>
      <a href="./admin.html" class="back-link">لوحة التحكم</a>
    </div>
  </header>

  <main class="container">

    <section class="page-heading">
      <div>
        <h1>إدارة الطلبات</h1>
        <p>متابعة وتعديل وطباعة طلبات الزبائن</p>
      </div>

      <button id="refreshButton" class="button" type="button">
        ↻ تحديث
      </button>
    </section>

    <div id="message" class="message" hidden></div>

    <section class="stats">
      <article class="stat-card">
        <span>كل الطلبات</span>
        <strong id="totalCount">0</strong>
      </article>

      <article class="stat-card">
        <span>طلبات جديدة</span>
        <strong id="newCount">0</strong>
      </article>

      <article class="stat-card">
        <span>قيد التحضير</span>
        <strong id="preparingCount">0</strong>
      </article>

      <article class="stat-card">
        <span>جاهزة</span>
        <strong id="readyCount">0</strong>
      </article>
    </section>

    <section class="filters">

      <div class="filter-field">
        <label for="branchFilter">الفرع</label>
        <select id="branchFilter">
          <option value="">كل الفروع</option>
        </select>
      </div>

      <div class="filter-field">
        <label for="statusFilter">حالة الطلب</label>
        <select id="statusFilter">
          <option value="">كل الحالات</option>
          <option value="new">جديد</option>
          <option value="preparing">قيد التحضير</option>
          <option value="ready">جاهز</option>
          <option value="out_for_delivery">خرج للتوصيل</option>
          <option value="delivered">تم التوصيل</option>
          <option value="cancelled">ملغي</option>
        </select>
      </div>

      <div class="filter-field search-field">
        <label for="searchInput">البحث عن طلب</label>
        <input
          id="searchInput"
          type="search"
          placeholder="رقم الطلب أو اسم الزبون أو الهاتف"
          autocomplete="off"
        >
      </div>

    </section>

    <section class="print-settings">
      <div class="print-settings-title">
        <strong>🖨️ إعدادات الطباعة</strong>
        <span>تطبق على جميع الطلبات</span>
      </div>

      <div class="print-settings-fields">
        <label>
          حجم الورقة
          <select id="printPaperSize">
            <option value="80mm">حراري 80mm</option>
            <option value="58mm">حراري 58mm</option>
            <option value="A5">A5</option>
            <option value="A4">A4</option>
          </select>
        </label>

        <label>
          عدد النسخ
          <input
            id="printCopies"
            type="number"
            min="1"
            max="10"
            value="1"
          >
        </label>
      </div>
    </section>

    <div class="orders-count-bar">
      <span>قائمة الطلبات</span>
      <span id="visibleOrdersCount">0 طلب</span>
    </div>

    <section id="ordersList" class="orders-list">
      <div class="loading">جارٍ تحميل الطلبات...</div>
    </section>

  </main>

  <script type="module" src="./orders.js"></script>
  <script src="./loader.js"></script>
  <script type="module" src="./notifications.js"></script>

</body>
</html>
