
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#741f1f">

    <title>تغيير كلمة المرور | مطعم الغنّام</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --primary: #741f1f;
            --primary-dark: #4b1111;
            --gold: #d7a84b;
            --background: #fffaf4;
            --text: #302323;
            --muted: #817575;
            --border: #eadfd5;
            --white: #ffffff;
            --success: #16834a;
            --error: #c62828;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Tahoma, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top right, #f5e5d2 0, transparent 38%),
                linear-gradient(135deg, #fffaf4, #f5eee7);
        }

        .page {
            width: 100%;
            max-width: 440px;
        }

        .card {
            padding: 34px 28px;
            background: var(--white);
            border: 1px solid rgba(116, 31, 31, 0.08);
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(75, 17, 17, 0.10);
        }

        .logo {
            display: block;
            width: 105px;
            height: 105px;
            object-fit: contain;
            margin: 0 auto 18px;
        }

        .brand {
            margin: 0 0 8px;
            text-align: center;
            color: var(--primary);
            font-size: 25px;
            font-weight: bold;
        }

        .subtitle {
            margin: 0 0 28px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: bold;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            height: 49px;
            padding: 0 14px 0 65px;
            border: 1px solid var(--border);
            border-radius: 11px;
            outline: none;
            background: #fffdfb;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(215, 168, 75, 0.15);
        }

        .toggle-password {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            padding: 7px;
            border: 0;
            background: transparent;
            color: var(--primary);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            min-height: 50px;
            margin-top: 8px;
            border: 0;
            border-radius: 11px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.8;
            text-align: center;
        }

        .message.show {
            display: block;
        }

        .message.success {
            color: var(--success);
            background: #eaf7ef;
            border: 1px solid #c9ead5;
        }

        .message.error {
            color: var(--error);
            background: #fff0f0;
            border: 1px solid #f3cccc;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: var(--primary);
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
        }

        @media (max-width: 420px) {
            .card {
                padding: 28px 20px;
            }

            .brand {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<main class="page">
    <section class="card">

        <img
            class="logo"
            src="image/logo.png"
            alt="شعار مطعم الغنّام"
            onerror="this.style.display='none'"
        >

        <h1 class="brand">مطعم الغنّام</h1>

        <p class="subtitle">
            تغيير كلمة المرور
            <br>
            أدخل كلمة المرور الجديدة لحسابك
        </p>

        <form id="resetForm">

            <div class="field">
                <label for="newPassword">كلمة المرور الجديدة</label>

                <div class="input-wrap">
                    <input
                        type="password"
                        id="newPassword"
                        placeholder="أدخل كلمة المرور الجديدة"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="newPassword"
                    >
                        إظهار
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="confirmPassword">تأكيد كلمة المرور</label>

                <div class="input-wrap">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="أعد كتابة كلمة المرور"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword"
                    >
                        إظهار
                    </button>
                </div>
            </div>

            <button
                type="submit"
                class="submit-btn"
                id="saveButton"
            >
                حفظ كلمة المرور
            </button>

        </form>

        <div class="message" id="message" role="status"></div>

        <a class="back-link" href="index.html">
            العودة إلى الصفحة الرئيسية
        </a>

    </section>

    <div class="footer">
        جميع الحقوق محفوظة © مطعم الغنّام
    </div>
</main>

<script type="module">
    // ================================================
    // مطعم الغنّام — تغيير كلمة المرور
    // استخدام اتصال Supabase المشترك
    // ================================================

    import {
        supabaseClient as supabase,
        isSupabaseConfigured as configured
    } from "./dashboard/supabase-client.js";

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("saveButton");

    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");

    let recoverySessionReady = false;

    function showMessage(text, type = "error") {
        message.textContent = text;
        message.className = `message show ${type}`;
    }

    function setLoading(loading) {
        button.disabled = loading;
        button.textContent = loading
            ? "جارٍ الحفظ..."
            : "حفظ كلمة المرور";
    }

    // إظهار وإخفاء كلمة المرور
    document.querySelectorAll(".toggle-password").forEach((toggle) => {
        toggle.addEventListener("click", () => {
            const input = document.getElementById(toggle.dataset.target);

            if (!input) return;

            const isPassword = input.type === "password";

            input.type = isPassword ? "text" : "password";
            toggle.textContent = isPassword ? "إخفاء" : "إظهار";
        });
    });

    // التحقق من إعدادات Supabase
    if (!configured || !supabase) {
        form.style.display = "none";

        showMessage(
            "تعذر الاتصال بالخادم. يرجى المحاولة لاحقاً.",
            "error"
        );
    } else {

        // التحقق من جلسة استعادة كلمة المرور
        async function checkRecoverySession() {
            try {
                const { data, error } = await supabase.auth.getSession();

                if (error) {
                    throw error;
                }

                if (data?.session) {
                    recoverySessionReady = true;
                    return true;
                }

                recoverySessionReady = false;

                form.style.display = "none";

                showMessage(
                    "رابط تغيير كلمة المرور غير صالح أو انتهت صلاحيته. يرجى طلب رابط جديد.",
                    "error"
                );

                return false;

            } catch (error) {
                console.error("Recovery session error:", error);

                form.style.display = "none";

                showMessage(
                    "تعذر التحقق من رابط الاستعادة. يرجى طلب رابط جديد.",
                    "error"
                );

                return false;
            }
        }

        // استقبال حدث استعادة كلمة المرور من Supabase
        supabase.auth.onAuthStateChange(async (event, session) => {
            if (event === "PASSWORD_RECOVERY" && session) {
                recoverySessionReady = true;
                form.style.display = "block";

                message.className = "message";
                message.textContent = "";
            }
        });

        // فحص الجلسة عند فتح الصفحة
        await checkRecoverySession();

        // حفظ كلمة المرور الجديدة
        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const password = newPassword.value;
            const confirmation = confirmPassword.value;

            if (password.length < 6) {
                showMessage(
                    "يجب أن تتكون كلمة المرور من 6 أحرف أو أرقام على الأقل.",
                    "error"
                );
                return;
            }

            if (password !== confirmation) {
                showMessage(
                    "كلمتا المرور غير متطابقتين.",
                    "error"
                );
                return;
            }

            if (!recoverySessionReady) {
                const sessionValid = await checkRecoverySession();

                if (!sessionValid) return;
            }

            try {
                setLoading(true);

                const { error } = await supabase.auth.updateUser({
                    password: password
                });

                if (error) {
                    throw error;
                }

                showMessage(
                    "تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.",
                    "success"
                );

                form.reset();
                form.style.display = "none";

                // إنهاء جلسة الاستعادة بعد نجاح التغيير
                const { error: signOutError } =
                    await supabase.auth.signOut();

                if (signOutError) {
                    console.warn(
                        "Sign out after password reset:",
                        signOutError
                    );
                }

            } catch (error) {
                console.error("Password update error:", error);

                showMessage(
                    error.message || "حدث خطأ أثناء تغيير كلمة المرور. حاول مرة أخرى.",
                    "error"
                );

            } finally {
                setLoading(false);
            }
        });
    }
</script>

</body>
</html>
