
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#741f1f">

    <title>تغيير كلمة المرور | مطعم الغنّام</title>

    <style>
        :root {
            --primary: #741f1f;
            --primary-dark: #4b1111;
            --gold: #d7a84b;
            --background: #fffaf4;
            --text: #432016;
            --muted: #8b7669;
            --border: #eadccd;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Tahoma, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top right, #f3e5d2 0, transparent 35%),
                radial-gradient(circle at bottom left, #f1e1d5 0, transparent 35%),
                var(--background);
        }

        .page-wrapper {
            width: 100%;
            max-width: 440px;
        }

        /* الشعار واسم المطعم */
        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-icon {
            width: 110px;
            height: 110px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .brand-icon img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 900;
            color: var(--primary-dark);
        }

        .brand p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        /* البطاقة الرئيسية */
        .reset-card {
            width: 100%;
            padding: 30px 26px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 15px 45px #4b111114;
        }

        .card-heading {
            text-align: center;
            margin-bottom: 26px;
        }

        .heading-icon {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            border-radius: 16px;
            background: #fff5e6;
            color: var(--primary);
        }

        .heading-icon svg {
            width: 27px;
            height: 27px;
        }

        .card-heading h2 {
            margin: 0;
            font-size: 21px;
            color: var(--primary-dark);
        }

        .card-heading p {
            margin: 9px 0 0;
            font-size: 13px;
            line-height: 1.8;
            color: var(--muted);
        }

        /* حقول الإدخال */
        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: bold;
            color: var(--text);
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            height: 49px;
            padding: 0 14px 0 48px;
            border: 1px solid var(--border);
            border-radius: 11px;
            outline: none;
            background: #fffdfa;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            direction: ltr;
            text-align: left;
            transition: .2s;
        }

        input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px #d7a84b22;
            background: white;
        }

        .toggle-password {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #927b6b;
            cursor: pointer;
        }

        .toggle-password svg {
            width: 19px;
            height: 19px;
        }

        .password-hint {
            margin-top: 8px;
            font-size: 11px;
            color: #9a887c;
        }

        /* زر الحفظ */
        .save-button {
            width: 100%;
            min-height: 50px;
            margin-top: 8px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px #741f1f25;
            transition: .2s;
        }

        .save-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 9px 20px #741f1f35;
        }

        .save-button:disabled {
            opacity: .65;
            cursor: wait;
        }

        /* رسائل الحالة */
        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.8;
            text-align: center;
        }

        #message.show {
            display: block;
        }

        #message.error {
            color: #a12626;
            background: #fff0ef;
            border: 1px solid #f2d0cd;
        }

        #message.success {
            color: #187044;
            background: #effaf3;
            border: 1px solid #ccebd7;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: var(--primary);
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .security-note {
            margin-top: 19px;
            padding-top: 15px;
            border-top: 1px solid #f0e8df;
            text-align: center;
            color: #9a887c;
            font-size: 11px;
        }

        /* الهواتف */
        @media (max-width: 480px) {
            body {
                padding: 20px 14px;
            }

            .brand-icon {
                width: 95px;
                height: 95px;
            }

            .reset-card {
                padding: 25px 19px;
                border-radius: 17px;
            }

            .brand h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <main class="page-wrapper">

        <!-- شعار المطعم -->
        <header class="brand">
            <div class="brand-icon">
                <img
                    src="image/logo.png"
                    alt="شعار مطعم الغنّام"
                >
            </div>

            <h1>مطعم الغنّام</h1>
            <p>أهلاً وسهلاً بكم دائماً</p>
        </header>

        <!-- بطاقة تغيير كلمة المرور -->
        <section class="reset-card">

            <div class="card-heading">
                <div class="heading-icon">
                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="10" width="16" height="11" rx="2"/>
                        <path d="M8 10V7a4 4 0 1 1 8 0v3"/>
                        <path d="M12 14v3"/>
                    </svg>
                </div>

                <h2>تغيير كلمة المرور</h2>

                <p>
                    أنشئ كلمة مرور جديدة لحسابك
                    واستمتع بتجربة التسوق في مطعم الغنّام.
                </p>
            </div>

            <form id="resetForm" hidden>

                <div class="form-group">
                    <label for="newPassword">
                        كلمة المرور الجديدة
                    </label>

                    <div class="input-wrap">
                        <input
                            id="newPassword"
                            type="password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                            placeholder="أدخل كلمة المرور الجديدة"
                        >

                        <button
                            class="toggle-password"
                            type="button"
                            data-target="newPassword"
                            aria-label="إظهار كلمة المرور"
                        >
                            <svg viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>

                    <div class="password-hint">
                        يجب أن تحتوي كلمة المرور على 6 أحرف على الأقل.
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        تأكيد كلمة المرور
                    </label>

                    <div class="input-wrap">
                        <input
                            id="confirmPassword"
                            type="password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                            placeholder="أعد كتابة كلمة المرور"
                        >

                        <button
                            class="toggle-password"
                            type="button"
                            data-target="confirmPassword"
                            aria-label="إظهار كلمة المرور"
                        >
                            <svg viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button
                    id="saveButton"
                    class="save-button"
                    type="submit"
                >
                    حفظ كلمة المرور
                </button>

            </form>

            <div id="message" role="status" aria-live="polite"></div>

            <a class="back-link" href="index.html">
                ← العودة إلى الصفحة الرئيسية
            </a>

            <div class="security-note">
                🔒 بيانات حسابك محمية وآمنة
            </div>

        </section>

    </main>

    <script type="module">
        import { createClient } from
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        import {
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        } from "./dashboard/supabase-config.js";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const button = document.getElementById("saveButton");

        function showMessage(text, type = "") {
            message.textContent = text;
            message.className = type ? `show ${type}` : "show";
        }

        // إظهار وإخفاء كلمة المرور
        document.querySelectorAll(".toggle-password").forEach(toggle => {
            toggle.addEventListener("click", () => {
                const input = document.getElementById(toggle.dataset.target);

                input.type = input.type === "password"
                    ? "text"
                    : "password";
            });
        });

        // التحقق من جلسة استعادة كلمة المرور
        try {
            const { data, error } = await supabase.auth.getSession();

            if (error) throw error;

            if (data.session) {
                form.hidden = false;
            } else {
                showMessage(
                    "رابط الاستعادة غير صالح أو انتهت صلاحيته. يرجى طلب رابط جديد.",
                    "error"
                );
            }

        } catch (error) {
            showMessage(
                "تعذر التحقق من رابط الاستعادة. يرجى المحاولة مرة أخرى.",
                "error"
            );

            console.error(error);
        }

        // حفظ كلمة المرور الجديدة
        form.addEventListener("submit", async event => {
            event.preventDefault();

            const password =
                document.getElementById("newPassword").value;

            const confirm =
                document.getElementById("confirmPassword").value;

            if (password.length < 6) {
                showMessage(
                    "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
                    "error"
                );
                return;
            }

            if (password !== confirm) {
                showMessage(
                    "كلمتا المرور غير متطابقتين.",
                    "error"
                );
                return;
            }

            button.disabled = true;
            button.textContent = "جاري حفظ كلمة المرور...";

            try {
                const { error } = await supabase.auth.updateUser({
                    password: password
                });

                if (error) throw error;

                form.reset();
                form.hidden = true;

                showMessage(
                    "تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول بحسابك.",
                    "success"
                );

                await supabase.auth.signOut();

            } catch (error) {
                console.error(error);

                showMessage(
                    error.message || "تعذر تغيير كلمة المرور. حاول مرة أخرى.",
                    "error"
                );

            } finally {
                button.disabled = false;
                button.textContent = "حفظ كلمة المرور";
            }
        });
    </script>

</body>
</html>
